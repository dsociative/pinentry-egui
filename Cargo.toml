[package]
name = "pinentry-egui"
version = "0.1.2"
edition = "2021"
authors = ["dsociative"]
description = "Native Wayland pinentry for GPG using egui"
repository = "https://github.com/dsociative/pinentry-egui"
license = "MIT OR Apache-2.0"
keywords = ["pinentry", "gpg", "wayland", "egui", "security"]
categories = ["cryptography", "gui"]
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
secrecy = "0.10"
zeroize = "1"

[features]
# Opt-in UI-automation hook for testing with egui_mcp. Compiled out by default;
# even when compiled in, eframe opens the inspection port only while the
# EGUI_INSPECTION env var is set. Do not enable in release builds of a real
# pinentry: it lets a local peer read the widget tree and inject input.
inspection = ["eframe/inspection"]

[dev-dependencies]
eframe = { version = "0.36", features = ["accesskit"] }
egui_kittest = "0.36"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1

[package]
name = "pinentry-egui"
version = "0.1.2"
edition = "2021"
authors = ["dsociative"]
description = "Native Wayland pinentry for GPG using egui"
repository = "https://github.com/dsociative/pinentry-egui"
license = "MIT OR Apache-2.0"
keywords = ["pinentry", "gpg", "wayland", "egui", "security"]
categories = ["cryptography", "gui"]
readme = "README.md"
exclude = ["CLAUDE.md"]

[dependencies]
secrecy = "0.10"
# The passphrase buffer is wiped on drop rather than merely freed, so a
# cancelled or submitted value does not linger in process memory.
zeroize = "1"

# egui triple: these three MUST stay together on the 0.34 line. The CPU software
# backend (egui_software_backend) is the linchpin: its latest release pins egui
# 0.34, which pins egui-winit 0.34 and winit 0.30.
egui = { version = "=0.34.3", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.34.3", default-features = false, features = ["wayland", "x11"] }
egui_software_backend = "=0.0.3"

# Windowing + pure-CPU presentation. No GPU/OpenGL/Vulkan in the tree: the UI is
# rasterized on the CPU by egui_software_backend and blitted with softbuffer.
winit = "=0.30.13"
softbuffer = "=0.4.8"
bytemuck = "1.25"

[dev-dependencies]
# Headless UI tests: drive pin_dialog_ui with synthetic input events and assert
# on the resulting state, no window required. Pinned to the egui 0.34 line.
egui_kittest = "=0.34.0"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
